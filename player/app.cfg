# WUP Boy's player: Peanut-GB (the cgb branch) and minigb_apu, both MIT. Started by WUP Boy with a game's path.
name = WUP Boy Player
author = wup-homebrew
version = 1.1.0
description = Started by WUP Boy
large = yes
screen8 = yes
net = yes                  # no RGB565 screen: the game's memory (.bss) fills WUP_BIGMEM
# the game needs most of WUP_BIGMEM: a trimmed lwIP (one TCP stream, netfs) frees ~100 KB for the rewind buffers
defines = WUP_NET_MEM_SIZE=24576 WUP_NET_PBUF_POOL=20 WUP_NETIF_RING=32768 WUP_NET_TCP_PCB=6 WUP_NET_TCP_PCB_LISTEN=2 WUP_NET_TCP_SEG=32 WUP_NET_NETCONN=6 WUP_NET_NETBUF=24
deps = peanut-gb
prebuild = gen.py
include = gen
sources = main.c gen/minigb_apu.c
